# nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────
# Rate limiting: 100 req/s per IP burst 200 (protects from retry floods)
# Upstream: round-robin to all app instances (scale app with --scale app=N)

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ── Rate limiting zone (10 MB shared memory = ~80k unique IPs) ──────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    # ── Upstream app pool ────────────────────────────────────────────────────
    upstream payment_gateway {
        least_conn;                         # route to least-busy instance
        server app:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"idempotency_key":"$http_idempotency_key"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Apply rate limit with burst; nodelay = don't queue, reject immediately
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;

        # Security headers
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-Frame-Options         "DENY"            always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "no-referrer"     always;

        # Forward real client IP
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header Host             $host;

        # Timeouts (30s max upstream response — matches Redis lock TTL)
        proxy_connect_timeout  5s;
        proxy_read_timeout     35s;
        proxy_send_timeout     35s;

        location / {
            proxy_pass http://payment_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # keepalive to upstream
        }

        location /health {
            proxy_pass http://payment_gateway/health;
            access_log off;   # don't spam logs with health checks
        }

        # Return 429 with JSON body for rate limited clients
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Slow down."}}';
        }
    }
}
