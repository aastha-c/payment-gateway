[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show local variables in tracebacks
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    unit: Pure unit tests (no external dependencies)
    integration: Tests requiring DB + Redis
    chaos: Failure injection / resilience tests
    slow: Tests that take > 2 seconds
